<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Professional mobile video editor built with Flutter.">
  <!-- Colours the browser chrome on Chrome/Edge to match the app bar. -->
  <meta name="theme-color" content="#15122A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Video Editor">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">

  <!-- Favicon. The 32px file is what Chrome and Edge draw in the tab strip;
       the 256px one covers bookmarks, history and hidpi displays. -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/Icon-32.png"/>
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png"/>

  <title>Video Editor</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
