name: video_editor
description: "Professional mobile video editor built with Flutter."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  provider: ^6.1.5+1
  collection: ^1.19.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2

  # media
  video_player: ^2.11.1
  just_audio: ^0.10.6
  photo_manager: ^3.12.0
  file_picker: ^10.0.0
  record: ^6.2.1

  # speech
  flutter_tts: ^4.2.5
  whisper_flutter_new: ^1.0.1

  # config
  flutter_dotenv: ^5.1.0

  # render / io
  ffmpeg_kit_flutter_new: ^4.6.2
  path_provider: ^2.1.6
  gal: ^2.3.3
  google_mlkit_selfie_segmentation: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/
    - assets/logo/
  shaders:
    - shaders/chroma_key.frag
    - shaders/grade_extras.frag
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
